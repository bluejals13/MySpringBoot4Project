<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<meta charset="UTF-8">

<body>

<h2>User Form</h2>

<form action="#"
      th:action="@{/adduser}"
      th:object="${userForm}"
      method="post">

    <label for="name">Name</label>
    <input type="text"
           th:field="*{name}"
           id="name">

    <span th:if="${#fields.hasErrors('name')}"
          th:errors="*{name}">
    </span>

    <br/>

    <label for="email">Email</label>
    <input type="text"
           th:field="*{email}"
           id="email">

    <span th:if="${#fields.hasErrors('email')}"
          th:errors="*{email}">
    </span>

    <br/>

    <!-- Password 추가 -->
    <label for="password">Password</label>
    <input type="password"
           th:field="*{password}"
           id="password">

    <span th:if="${#fields.hasErrors('password')}"
          th:errors="*{password}">
    </span>

    <br/>

    <input type="submit" value="Add User">

</form>

</body>
</html>
